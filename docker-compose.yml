version: '3.8'
services:
  web:
    build: .
    container_name: ultrablabla-web
    restart: unless-stopped
    ports:
      - "44432:44432"
    environment:
      - NODE_ENV=production
      - PORT=44432
      - ASR_BACKEND_URL=http://qwen-asr:8080
      - TTS_BACKEND_URL=http://qwen-tts:8080
      - TTS_SIDECAR_URL=http://tts-api-sidecar:5000
      - CLASSIFIER_BACKEND_URL=http://qwen-audio-classifier:8080
      - AI_API_URL=https://api.guig.dev
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
    networks:
      - ai-network

networks:
  ai-network:
    external: true