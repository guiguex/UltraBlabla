name = "audiollm-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]

# Defaults match the Bun gateway. Override via:
#   wrangler secret put LLM_BACKEND_URL
#   wrangler secret put ASR_BACKEND_URL
#   wrangler secret put TTS_BACKEND_URL
#   wrangler secret put TTS_SIDECAR_URL
#   wrangler secret put CORS_ORIGIN

[vars]
LLM_BACKEND_URL = "https://api.guig.dev"
CORS_ORIGIN = "*"

[observability]
enabled = true