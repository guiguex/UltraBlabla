<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silero VAD v5 — WebGPU DO + R2</title>
  <style>
    :root {
      --bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
      --green:#3fb950;--red:#f85149;--blue:#58a6ff;--yellow:#d29922;--purple:#bc8cff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .container{max-width:560px;width:100%}
    h1{font-size:1.4rem;margin-bottom:.25rem}
    .subtitle{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
    .badge{display:inline-block;background:rgba(188,140,255,.15);color:var(--purple);padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;margin-left:.5rem;vertical-align:middle}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
    .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
    .label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
    .value{font-weight:600;font-size:.95rem}
    .status{padding:2px 10px;border-radius:6px;font-size:.8rem;font-weight:600}
    .status.running{background:rgba(63,185,80,.15);color:var(--green)}
    .status.loading{background:rgba(88,166,255,.15);color:var(--blue)}
    .status.error{background:rgba(248,81,73,.15);color:var(--red)}
    .indicator{text-align:center;padding:1rem;border-radius:10px;font-size:1.1rem;font-weight:700;letter-spacing:.05em;margin-bottom:1rem;transition:background .15s}
    .indicator.silence{background:rgba(139,148,158,.1);color:var(--muted)}
    .indicator.speech{background:rgba(63,185,80,.2);color:var(--green)}
    .meter-wrap{margin-bottom:1rem}
    .meter-bar-bg{height:24px;background:rgba(139,148,158,.1);border-radius:6px;overflow:hidden;position:relative}
    .meter-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--green));border-radius:6px;transition:width .05s linear;width:0%}
    .threshold-line{position:absolute;top:0;bottom:0;width:2px;background:var(--yellow);left:50%;opacity:.6}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:1rem}
    .stat{text-align:center}
    .stat .v{font-size:1.1rem;font-weight:700}
    .stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase}
    .buttons{display:flex;gap:.75rem}
    button{flex:1;padding:.75rem;border:1px solid var(--border);border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
    button:disabled{opacity:.4;cursor:not-allowed}
    #startBtn{background:var(--green);color:#fff;border-color:var(--green)}
    #startBtn:hover:not(:disabled){background:#2ea043}
    #stopBtn{background:transparent;color:var(--red);border-color:var(--red)}
    #stopBtn:hover:not(:disabled){background:rgba(248,81,73,.1)}
    .log-box{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:.75rem;max-height:140px;overflow-y:auto;font-family:"SF Mono",monospace;font-size:.75rem;color:var(--muted)}
    .log-box div{margin-bottom:2px}
    .note{font-size:.75rem;color:var(--muted);margin-top:1rem;line-height:1.5}
    .note code{background:rgba(139,148,158,.15);padding:1px 5px;border-radius:3px;font-size:.7rem}
  </style>
</head>
<body>
  <div class="container">
    <h1>🗣️ Silero VAD v5 <span class="badge">WebGPU DO + R2</span></h1>
    <p class="subtitle">Server-side inference — DO WebGPU + onnxruntime-web (WASM from R2)</p>
    <div class="card">
      <div class="row"><span class="label">Statut</span><span id="status" class="status">Stopped</span></div>
      <div class="row"><span class="label">Backend DO</span><span id="backend" class="value">—</span></div>
      <div class="indicator silence" id="speechIndicator">—</div>
      <div class="meter-wrap"><div class="meter-bar-bg"><div class="meter-bar" id="probBar"></div><div class="threshold-line"></div></div></div>
      <div class="stats">
        <div class="stat"><div class="v" id="probValue">0.0%</div><div class="l">Probabilité</div></div>
        <div class="stat"><div class="v" id="latency">—</div><div class="l">Latence DO</div></div>
        <div class="stat"><div class="v" id="fps">—</div><div class="l">Frames/s</div></div>
      </div>
      <div class="buttons"><button id="startBtn">▶ Démarrer</button><button id="stopBtn" disabled>■ Arrêter</button></div>
    </div>
    <div class="card"><div class="label" style="margin-bottom:.5rem">Journal</div><div class="log-box" id="log"></div></div>
    <p class="note">WASM ORT (26.5 MiB) + modèle VAD (1.1 MiB) servis depuis R2. Le bundle Worker reste léger.</p>
  </div>
  <script src="vad-client.js"></script>
</body>
</html>
